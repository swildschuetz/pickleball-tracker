<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickleball-Tracker</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mu:#6b756e;--ac:#2f8f5b;--ac2:#e8f3ec;--bd:#dfe4de;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121613;--card:#1c221e;--tx:#e8ece9;--mu:#92a097;--ac:#4cc38a;--ac2:#1f3228;--bd:#2c352f;--rd:#ef6a5b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--card:#1c221e;--tx:#e8ece9;--mu:#92a097;--ac:#4cc38a;--ac2:#1f3228;--bd:#2c352f;--rd:#ef6a5b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:20px;margin:6px 0 10px}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:1;white-space:nowrap}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.del{color:var(--rd);padding:4px 9px}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>button{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--bd);border-radius:20px;padding:7px 13px;cursor:pointer;user-select:none}
.chip.on{background:var(--ac2);border-color:var(--ac);font-weight:600}
.mu{color:var(--mu);font-size:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:10px 0}
.team{background:var(--ac2);border-radius:12px;padding:10px;font-weight:600}
.sc{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.sc input{text-align:center;font-size:24px;font-weight:700}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;cursor:pointer}
td.n{font-weight:600}
.m{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.w{font-weight:700}
</style>
</head>
<body>
<main>
<h1>🏓 Pickleball-Tracker</h1>
<nav id="nav"></nav>
<div id="v"></div>
</main>
<script>

  const V='10.14.1',B='https://www.gstatic.com/firebasejs/'+V+'/';
  const [app,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js')]);
  const a=app.initializeApp({
    apiKey:"AIzaSyDbRagfiIc0shyIPTAP_CTROYVesNsH1CA",
    authDomain:"pickleball-tracker-ccacf.firebaseapp.com",
    projectId:"pickleball-tracker-ccacf",
    storageBucket:"pickleball-tracker-ccacf.firebasestorage.app",
    messagingSenderId:"969655317847",
    appId:"1:969655317847:web:5c5bbbd301f4b49863fa12"
  });
  const d=fs.getFirestore(a);
  return{
    doc:p=>({set:x=>fs.setDoc(fs.doc(d,p),x),delete:()=>fs.deleteDoc(fs.doc(d,p))}),

<script>
const KEY='pb-tracker-v1';
let S={players:[],matches:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S.players)S.players=[];if(!S.matches)S.matches=[];
let tab='play',present=new Set(),cur=null,sortK='avgPts',sortD=-1;
const uid=()=>Math.random().toString(36).slice(2,9);
let DB=null,ro=false,NOTE='';
const dbw=p=>p.catch(e=>alert('Speichern fehlgeschlagen: '+(e&&(e.code||e.message)||e)));
const save=()=>{if(DB)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function addPlayer(p){S.players.push(p);save();if(DB)dbw(DB.doc('players/'+p.id).set({name:p.name}))}
function delMatch(id){S.matches=S.matches.filter(m=>m.id!==id);save();if(DB)dbw(DB.doc('matches/'+id).delete())}
function delPlayer(id){S.matches.filter(m=>[...m.a,...m.b].includes(id)).forEach(m=>delMatch(m.id));S.players=S.players.filter(p=>p.id!==id);save();if(DB)dbw(DB.doc('players/'+id).delete())}
function addMatch(m){S.matches.push(m);save();if(DB)dbw(DB.doc('matches/'+m.id).set({t:m.t,a:m.a,b:m.b,sa:m.sa,sb:m.sb}))}
function importAll(d){if(!DB){S=d;save();return}d.players.forEach(addPlayer);d.matches.forEach(addMatch)}
function roMsg(){return '<div class="card">👀 Du hast Leserechte: Tabelle und Verlauf siehst du live. Eintragen kann nur, wer Bearbeitungsrechte hat.</div>'}
(async()=>{
 await 0;
 try{
  DB=await window.__fbP;
  S={players:[],matches:[]};NOTE='Lade Daten…';render();
  const tm=setTimeout(()=>{NOTE='Daten noch nicht erreichbar, Stand evtl. veraltet.';render()},10000);
  const er=()=>{clearTimeout(tm);NOTE='Fehler beim Laden der Daten. Prüfe die Firestore-Regeln.';render()};
  DB.collection('players').onSnapshot(s=>{clearTimeout(tm);NOTE='';S.players=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));render()},er);
  DB.collection('matches').onSnapshot(s=>{clearTimeout(tm);NOTE='';S.matches=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>x.t-y.t);render()},er);
 }catch(e){DB=null;NOTE='Offline-Modus: Keine Verbindung zur Datenbank, Daten liegen nur auf diesem Gerät.';render()}
})();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>{const p=S.players.find(p=>p.id===id);return p?esc(p.name):'?'};
const fmt=(n,d=1)=>isFinite(n)?n.toFixed(d).replace('.',','):'–';

function stats(ms=M()){
  const st={};S.players.forEach(p=>st[p.id]={id:p.id,name:p.name,g:0,w:0,l:0,pf:0,pa:0,part:{},opp:{}});
  ms.forEach(m=>{
    [[m.a,m.sa,m.sb],[m.b,m.sb,m.sa]].forEach(([team,f,a])=>team.forEach(id=>{
      const s=st[id];if(!s)return;
      s.g++;s.pf+=f;s.pa+=a;f>a?s.w++:s.l++;
      team.forEach(o=>{if(o!==id){const q=s.part[o]||(s.part[o]={g:0,w:0});q.g++;if(f>a)q.w++}});
      (team===m.a?m.b:m.a).forEach(o=>{const q=s.opp[o]||(s.opp[o]={g:0,w:0});q.g++;if(f>a)q.w++});
    }));
  });
  return Object.values(st).map(s=>({...s,quote:s.g?s.w/s.g*100:NaN,avgPts:s.g?s.pf/s.g:NaN,avgOpp:s.g?s.pa/s.g:NaN,diff:s.g?(s.pf-s.pa)/s.g:NaN}));
}

function suggest(){
  const ids=[...present].filter(id=>S.players.some(p=>p.id===id));
  if(ids.length<4)return null;
  const games={},pc={},oc={};
  ids.forEach(i=>games[i]=0);
  S.matches.forEach(m=>{
    [...m.a,...m.b].forEach(i=>{if(i in games)games[i]++});
    const pr=(t,k)=>{for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const key=[t[i],t[j]].sort().join('|');pc[key]=(pc[key]||0)+1}};
    pr(m.a);pr(m.b);
    m.a.forEach(x=>m.b.forEach(y=>{const key=[x,y].sort().join('|');oc[key]=(oc[key]||0)+1}));
  });
  const sh=[...ids].sort(()=>Math.random()-.5).sort((a,b)=>games[a]-games[b]);
  const four=sh.slice(0,4);
  const [p,q,r,s]=four;
  const opts=[[[p,q],[r,s]],[[p,r],[q,s]],[[p,s],[q,r]]];
  const k=(x,y)=>[x,y].sort().join('|');
  let best=null,bs=1e9;
  opts.sort(()=>Math.random()-.5).forEach(([a,b])=>{
    let sc=(pc[k(...a)]||0)*3+(pc[k(...b)]||0)*3;
    a.forEach(x=>b.forEach(y=>sc+=(oc[k(x,y)]||0)));
    if(sc<bs){bs=sc;best=[a,b]}
  });
  return{a:best[0],b:best[1],sit:ids.filter(i=>!four.includes(i))};
}

function nav(){
  const T=[['play','Spiel'],['table','Tabelle'],['ew','Ewige Tabelle'],['pro','Profil'],['du','Duelle'],['tm','Teams'],['hist','Verlauf'],['pl','Spieler']];
  document.getElementById('nav').innerHTML=T.map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
}

function vPlay(){if(ro)return roMsg();
  if(S.players.length<2)return `<div class="card">Lege zuerst im Reiter <b>Spieler</b> mindestens 2 Spieler an.</div>`;
  const chips=S.players.map(p=>`<span class="chip ${present.has(p.id)?'on':''}" data-p="${p.id}">${esc(p.name)}</span>`).join('');
  let h=`<div class="card"><b>Wer ist heute dabei?</b><div class="chips">${chips}</div>
  <div class="row"><button class="pri" id="sug">🎲 Paarung vorschlagen (4–6 Spieler, doubles)</button></div></div>`;
  h+=`<div class="card"><b>Paarung</b> <span class="mu">– oder manuell wählen</span>
  <div class="row" style="margin-top:8px">${[0,1,2,3].map(i=>`<select data-s="${i}"><option value="">${i<2?'Team A':'Team B'} · Spieler</option>${S.players.map(p=>`<option value="${p.id}" ${cur&&cur[i]===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`).slice(0,2).join('')}</div>
  <div class="row" style="margin-top:8px">${[2,3].map(i=>`<select data-s="${i}"><option value="">Team B · Spieler</option>${S.players.map(p=>`<option value="${p.id}" ${cur&&cur[i]===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`).join('')}</div>
  <div class="mu" style="margin-top:6px">Für Einzel je nur einen Spieler pro Team wählen.</div>
  <div class="vs"><div class="team" id="ta">${cur?[cur[0],cur[1]].filter(Boolean).map(nm).join(' & ')||'–':'–'}</div><span class="mu">vs</span><div class="team" id="tb">${cur?[cur[2],cur[3]].filter(Boolean).map(nm).join(' & ')||'–':'–'}</div></div>
  ${sitOut?`<div class="mu">Pause: ${sitOut.map(nm).join(', ')}</div>`:''}
  <div class="row" style="margin-top:10px"><span class="mu" style="flex:none">Spieldatum</span><input id="dt" type="date" value="${today()}"></div><div class="sc" style="margin-top:10px"><input id="sa" type="number" inputmode="numeric" min="0" placeholder="0"><span class="mu">:</span><input id="sb" type="number" inputmode="numeric" min="0" placeholder="0"></div>
  <div class="row" style="margin-top:10px"><button class="pri" id="sv">Ergebnis speichern</button></div><div id="err" class="mu" style="color:var(--rd);margin-top:6px"></div></div>`;
  return h;
}
let sitOut=null;
function bindPlay(){
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const id=c.dataset.p;present.has(id)?present.delete(id):present.add(id);render()});
  const sg=document.getElementById('sug');if(!sg)return;
  sg.onclick=()=>{const r=suggest();if(!r){document.getElementById('err').textContent='Wähle mindestens 4 Spieler aus.';return}cur=[r.a[0],r.a[1],r.b[0],r.b[1]];sitOut=r.sit;render()};
  document.querySelectorAll('select[data-s]').forEach(s=>s.onchange=()=>{cur=cur||['','','',''];cur[+s.dataset.s]=s.value;sitOut=null;render()});
  document.getElementById('sv').onclick=()=>{
    const e=document.getElementById('err');
    const c=cur||['','','',''];
    const a=[c[0],c[1]].filter(Boolean),b=[c[2],c[3]].filter(Boolean);
    const sa=parseInt(document.getElementById('sa').value),sb=parseInt(document.getElementById('sb').value);
    if(!a.length||a.length!==b.length){e.textContent='Beide Teams brauchen gleich viele Spieler (1 oder 2).';return}
    if(new Set([...a,...b]).size!==a.length+b.length){e.textContent='Ein Spieler ist doppelt gewählt.';return}
    if(isNaN(sa)||isNaN(sb)||sa===sb){e.textContent='Bitte ein gültiges Ergebnis ohne Unentschieden eintragen.';return}
    addMatch({id:uid(),t:matchT(),a,b,sa,sb});document.getElementById('sa').value='';document.getElementById('sb').value='';cur=null;sitOut=null;render();
  };
}

function vTable(){
  const rows=stats().filter(s=>s.g>0||true);
  if(!M().length)return `<div class="card">Noch keine Spiele in diesem Zeitraum.</div>`;
  rows.sort((x,y)=>{const a=isNaN(x[sortK])?-1e9:x[sortK],b=isNaN(y[sortK])?-1e9:y[sortK];return typeof x[sortK]==='string'?sortD*x[sortK].localeCompare(y[sortK]):sortD*(a-b)});
  const cols=[['name','Spieler'],['g','Sp'],['w','S'],['l','N'],['quote','Quote %'],['pf','Punkte'],['avgPts','Ø Pkt'],['avgOpp','Ø Gegner'],['diff','Ø Diff']];
  let h=`<div class="card tw"><table><thead><tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${sortK===k?(sortD<0?' ↓':' ↑'):''}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(s=>h+=`<tr><td class="n">${esc(s.name)}</td><td>${s.g}</td><td>${s.w}</td><td>${s.l}</td><td>${fmt(s.quote,0)}</td><td>${s.pf}</td><td>${fmt(s.avgPts)}</td><td>${fmt(s.avgOpp)}</td><td>${s.diff>0?'+':''}${fmt(s.diff)}</td></tr>`);
  h+=`</tbody></table><div class="mu" style="margin-top:8px">Tippe auf eine Spaltenüberschrift zum Sortieren. Ø Pkt = eigene Punkte pro Spiel.</div></div>`;
  const mx=Math.max(1,...stats().map(s=>s.pf));
  h+=`<div class="card"><b>Ranking Einzelpunkte</b> <span class="mu">(alle erzielten Punkte, auch bei Niederlagen)</span>`+stats().sort((a,b)=>b.pf-a.pf).map((s,i)=>`<div style="margin-top:8px"><div class="row" style="justify-content:space-between"><span>${i+1}. <b>${esc(s.name)}</b></span><span class="w" style="text-align:right">${s.pf}</span></div><div style="height:6px;background:var(--ac2);border-radius:3px"><div style="height:6px;width:${s.pf/mx*100}%;background:var(--ac);border-radius:3px"></div></div></div>`).join('')+`</div>`;
  h+=`<div class="card"><b>Formkurve</b> <span class="mu">(letzte 10 Spiele, links alt → rechts neu)</span>`+S.players.map(p=>`<div class="m"><span><b>${esc(p.name)}</b></span><span>${formHtml(p.id)||'<span class="mu">–</span>'}</span></div>`).join('')+`</div>`;
  let best='';
  stats().forEach(s=>{
    const arr=Object.entries(s.part).filter(([,q])=>q.g>=2).map(([id,q])=>({id,g:q.g,r:q.w/q.g})).sort((a,b)=>b.r-a.r||b.g-a.g);
    if(arr.length)best+=`<div class="m"><span><b>${esc(s.name)}</b></span><span>${nm(arr[0].id)} · ${Math.round(arr[0].r*100)}% (${arr[0].g} Sp)</span></div>`;
  });
  if(best)h+=`<div class="card"><b>Bester Partner</b> <span class="mu">(ab 2 gemeinsamen Spielen)</span>${best}</div>`;
  return h;
}

function vHist(){
  if(!S.matches.length)return `<div class="card">Noch keine Spiele.</div>`;
  return `<div class="card">`+[...M()].reverse().map(m=>{
    const d=new Date(m.t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
    const aw=m.sa>m.sb;
    return `<div class="m"><div><div class="${aw?'w':''}">${m.a.map(nm).join(' & ')}</div><div class="${aw?'':'w'}">${m.b.map(nm).join(' & ')}</div></div><div style="text-align:right"><div class="w">${m.sa} : ${m.sb}</div><div class="mu">${d}</div></div>${ro?'':`<button class="del" data-d="${m.id}">✕</button>`}</div>`;
  }).join('')+`</div>`;
}

let selP=null;
function vPro(){
  if(!S.players.length)return '<div class="card">Noch keine Spieler.</div>';
  if(!S.players.some(p=>p.id===selP))selP=S.players[0].id;
  const s=stats().find(x=>x.id===selP);
  const rk=o=>Object.entries(o).map(([id,q])=>({id,g:q.g,w:q.w,r:q.w/q.g}));
  const bp=rk(s.part).sort((a,b)=>b.r-a.r||b.g-a.g)[0];
  const hd=rk(s.opp).sort((a,b)=>a.r-b.r||b.g-a.g)[0];
  const line=x=>x?`${nm(x.id)} <span class="mu">· ${x.w} S / ${x.g-x.w} N</span>`:'<span class="mu">noch offen</span>';
  const k=(l,v)=>`<div class="team"><div class="mu" style="font-weight:400">${l}</div>${v}</div>`;
  const g3='style="grid-template-columns:1fr 1fr 1fr"';
  const my=[...M()].reverse().filter(m=>m.a.includes(selP)||m.b.includes(selP));
  let h=`<div class="card"><select id="ps">${S.players.map(p=>`<option value="${p.id}" ${p.id===selP?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
  <div class="vs" ${g3}>${k('Spiele',s.g)}${k('Siege',s.w+' ('+fmt(s.quote,0)+'%)')}${k('Ø Punkte',fmt(s.avgPts))}</div>
  <div class="vs" ${g3}>${k('Punkte',s.pf)}${k('Ø Gegner',fmt(s.avgOpp))}${k('Ø Diff',(s.diff>0?'+':'')+fmt(s.diff))}</div><div class="m" style="border:0"><span>Form (letzte 10)</span><span>${formHtml(selP)||'–'}</span></div></div>`;
  h+=`<div class="card"><div class="m"><span>🤝 <b>Bester Mitspieler</b></span><span>${line(bp)}</span></div><div class="m"><span>💪 <b>Härtester Gegner</b></span><span>${line(hd)}</span></div><div class="mu" style="margin-top:6px">Bester Mitspieler: höchste Siegquote im gemeinsamen Team. Härtester Gegner: niedrigste eigene Siegquote gegen ihn. Bei Gleichstand zählt die größere Spielzahl.</div></div>`;
  h+=`<div class="card"><b>Spielhistorie</b>`+(my.length?my.map(m=>{
    const inA=m.a.includes(selP),mine=inA?m.a:m.b,opp=inA?m.b:m.a,f=inA?m.sa:m.sb,a=inA?m.sb:m.sa;
    const pt=mine.filter(i=>i!==selP);
    const d=new Date(m.t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
    return `<div class="m"><div><div>${pt.length?'mit '+pt.map(nm).join(' & '):'Einzel'}</div><div class="mu">gegen ${opp.map(nm).join(' & ')} · ${d}</div></div><div class="w" style="text-align:right">${f} : ${a} <span style="color:${f>a?'var(--ac)':'var(--rd)'}">${f>a?'S':'N'}</span></div></div>`;
  }).join(''):'<div class="mu">Noch keine Spiele.</div>')+`</div>`;
  return h;
}
const isToday=t=>new Date(t).toDateString()===new Date().toDateString();
const M=()=>S.matches.filter(m=>season==='all'||(season==='heute'?isToday(m.t):new Date(m.t).getFullYear()===+season)).sort((a,b)=>a.t-b.t);
let season='all';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const matchT=()=>{const v=document.getElementById('dt').value,n=new Date();if(!v)return n.getTime();return new Date(v+'T00:00:00').getTime()+((n.getHours()*60+n.getMinutes())*60+n.getSeconds())*1000};
const formHtml=id=>M().filter(m=>m.a.includes(id)||m.b.includes(id)).slice(-10).map(m=>{const w=m.a.includes(id)?m.sa>m.sb:m.sb>m.sa;return `<span style="display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;font-size:12px;font-weight:700;margin-right:3px;color:#fff;background:${w?'var(--ac)':'var(--rd)'}">${w?'S':'N'}</span>`}).join('');
function seasonBar(){
  if(!['table','pro','du','hist','tm'].includes(tab))return '';
  const ys=[...new Set([...S.matches.map(m=>new Date(m.t).getFullYear()),new Date().getFullYear()])].sort();
  const opts=tab==='table'?['heute',...ys]:['all','heute',...ys];
  if(!opts.includes(season)&&!opts.includes(+season))season=opts[0];
  return `<div class="chips" style="margin-top:0">${opts.map(y=>`<span class="chip ${String(y)===String(season)?'on':''}" data-y="${y}">${y==='all'?'Gesamt':y==='heute'?'Heute':'Saison '+y}</span>`).join('')}</div>`;
}
function vTm(){
  const T={};
  M().forEach(m=>[[m.a,m.sa,m.sb],[m.b,m.sb,m.sa]].forEach(([t,f,a])=>{
    if(t.length!==2)return;
    const ids=[...t].sort(),k=ids.join('|');
    const q=T[k]||(T[k]={ids,g:0,w:0,l:0,pf:0,pa:0});
    q.g++;f>a?q.w++:q.l++;q.pf+=f;q.pa+=a;
  }));
  const L=Object.values(T);
  if(!L.length)return '<div class="card">Noch keine Doppelspiele.</div>';
  L.forEach(q=>q.r=q.w/q.g);
  const d=q=>q.pf-q.pa;
  L.sort((x,y)=>y.r-x.r||y.g-x.g||d(y)-d(x));
  const mg=L.some(q=>q.g>=2)?2:1,el=L.filter(q=>q.g>=mg);
  const best=el[0],worst=[...el].sort((x,y)=>x.r-y.r||y.g-x.g||d(x)-d(y))[0];
  const nt=q=>q.ids.map(nm).join(' &amp; ');
  const pc=(n,g)=>` (${fmt(n/g*100,0)}%)`;
  const box=(t,q)=>`<div class="team"><div class="mu" style="font-weight:400">${t}</div>${nt(q)}<div class="mu" style="font-weight:400">${q.w} S / ${q.l} N (${fmt(q.r*100,0)}%)</div></div>`;
  return `<div class="card"><div class="vs" style="grid-template-columns:1fr 1fr">${box('🏆 Bestes Team',best)}${box('🐢 Schlechtestes Team',worst)}</div><div class="mu">Gewertet ab ${mg} gemeinsamen Spielen, nach Siegquote.</div></div><div class="card tw"><table><thead><tr><th>Team</th><th>Spiele</th><th>Siege</th><th>Niederlagen</th><th>Punkte</th><th>Gegenpunkte</th><th>Differenz</th></tr></thead><tbody>${L.map(q=>`<tr><td class="n">${nt(q)}</td><td>${q.g}</td><td>${q.w}${pc(q.w,q.g)}</td><td>${q.l}${pc(q.l,q.g)}</td><td>${q.pf}</td><td>${q.pa}</td><td>${d(q)>0?'+':''}${d(q)}</td></tr>`).join('')}</tbody></table></div>`;
}
function vEw(){
  if(!S.matches.length)return '<div class="card">Noch keine Spiele eingetragen.</div>';
  const p=(n,g)=>g?` (${fmt(n/g*100,0)}%)`:'';
  const rows=stats(S.matches).sort((x,y)=>y.w-x.w||(y.pf-y.pa)-(x.pf-x.pa)||y.pf-x.pf);
  return `<div class="card tw"><table><thead><tr><th>Spieler</th><th>Spiele</th><th>Siege</th><th>Niederlagen</th><th>Punkte</th><th>Gegenpunkte</th><th>Differenz</th></tr></thead><tbody>`+rows.map(s=>{const d=s.pf-s.pa;return `<tr><td class="n">${esc(s.name)}</td><td>${s.g}</td><td>${s.w}${p(s.w,s.g)}</td><td>${s.l}${p(s.l,s.g)}</td><td>${s.pf}</td><td>${s.pa}</td><td>${d>0?'+':''}${d}</td></tr>`}).join('')+`</tbody></table><div class="mu" style="margin-top:8px">Alle Spiele seit Beginn, sortiert nach Siegen, dann Differenz.</div></div>`;
}
function vDu(){
  if(!S.players.length)return '<div class="card">Noch keine Spieler.</div>';
  if(!S.players.some(p=>p.id===selP))selP=S.players[0].id;
  const o={};
  S.players.forEach(p=>{if(p.id!==selP)o[p.id]={g:0,w:0,l:0,pf:0,pa:0}});
  const tot={g:0,w:0,l:0,pf:0,pa:0};
  M().forEach(m=>{
    const inA=m.a.includes(selP),inB=m.b.includes(selP);if(!inA&&!inB)return;
    const f=inA?m.sa:m.sb,a=inA?m.sb:m.sa,opp=inA?m.b:m.a,win=f>a;
    tot.g++;win?tot.w++:tot.l++;tot.pf+=f;tot.pa+=a;
    opp.forEach(id=>{const q=o[id];if(!q)return;q.g++;win?q.w++:q.l++;q.pf+=f;q.pa+=a});
  });
  const pc=(n,g)=>g?` (${fmt(n/g*100,0)}%)`:'';
  const row=(name,q,b)=>{const d=q.pf-q.pa;return `<tr${b?' style="font-weight:700"':''}><td class="n">${name}</td><td>${q.g}</td><td>${q.w}${pc(q.w,q.g)}</td><td>${q.l}${pc(q.l,q.g)}</td><td>${q.pf}</td><td>${q.pa}</td><td>${d>0?'+':''}${d}</td></tr>`};
  const list=Object.entries(o).filter(([,q])=>q.g>0).sort((x,y)=>y[1].g-x[1].g);
  return `<div class="card"><select id="ps">${S.players.map(p=>`<option value="${p.id}" ${p.id===selP?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`+
  (tot.g?`<div class="card tw"><table><thead><tr><th>Gegner</th><th>Spiele</th><th>Siege</th><th>Niederlagen</th><th>Punkte</th><th>Gegenpunkte</th><th>Differenz</th></tr></thead><tbody>${list.map(([id,q])=>row(nm(id),q,false)).join('')}${row('Gesamt',tot,true)}</tbody></table><div class="mu" style="margin-top:8px">Bilanz aus Sicht des gewählten Spielers. Im Doppel zählt jedes Spiel gegen beide Gegner; „Gesamt“ zählt jedes Spiel nur einmal.</div></div>`:'<div class="card">Dieser Spieler hat noch keine Spiele.</div>');
}
function vPl(){if(ro)return roMsg();
  return `<div class="card"><div class="row"><input id="np" placeholder="Name des neuen Spielers" maxlength="30"><button class="pri" id="add">Hinzufügen</button></div></div>
  <div class="card">${S.players.length?S.players.map(p=>`<div class="m"><span>${esc(p.name)}</span><button class="del" data-r="${p.id}">Entfernen</button></div>`).join(''):'<span class="mu">Noch keine Spieler.</span>'}</div>
  <div class="card"><b>Daten sichern</b><div class="mu">Gespeichert wird nur in diesem Browser. Zum Übertragen oder Sichern:</div>
  <div class="row" style="margin-top:8px"><button id="ex">Exportieren</button><button id="im">Importieren</button></div>
  <textarea id="io" style="display:none;width:100%;height:110px;margin-top:8px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px"></textarea>
  <div class="row" style="margin-top:8px"><button id="go" style="display:none" class="pri">Daten übernehmen</button></div></div>`;
}
function bindPl(){
  const add=()=>{const i=document.getElementById('np'),n=i.value.trim();if(!n)return;addPlayer({id:uid(),name:n});render()};
  document.getElementById('add').onclick=add;
  document.getElementById('np').onkeydown=e=>{if(e.key==='Enter')add()};
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.r;
    if(S.matches.some(m=>[...m.a,...m.b].includes(id))){if(!confirm('Dieser Spieler hat Spiele. Beim Entfernen werden auch diese Spiele gelöscht. Fortfahren?'))return;}
    delPlayer(id);present.delete(id);render();
  });
  const io=document.getElementById('io'),go=document.getElementById('go');
  document.getElementById('ex').onclick=()=>{io.style.display='block';go.style.display='none';io.value=JSON.stringify(S);io.select()};
  document.getElementById('im').onclick=()=>{io.style.display='block';go.style.display='inline-block';io.value='';io.placeholder='Exportierten Text hier einfügen'};
  go.onclick=()=>{try{const d=JSON.parse(io.value);if(!Array.isArray(d.players)||!Array.isArray(d.matches))throw 0;importAll(d);render()}catch(e){alert('Ungültige Daten.')}};
}

function render(){
  nav();
  const v=document.getElementById('v');
  const keep=['sa','sb','np','dt'].map(i=>{const e=document.getElementById(i);return e?e.value:''});
  const had=document.activeElement&&document.activeElement.id;
  v.innerHTML=(NOTE?`<div class="mu" style="margin-bottom:8px">${NOTE}</div>`:'')+seasonBar()+{play:vPlay,table:vTable,ew:vEw,pro:vPro,du:vDu,tm:vTm,hist:vHist,pl:vPl}[tab]();
  ['sa','sb','np','dt'].forEach((i,k)=>{const e=document.getElementById(i);if(e&&keep[k])e.value=keep[k]});
  if(had){const e=document.getElementById(had);if(e&&e.tagName==='INPUT')e.focus()}
  if(tab==='play')bindPlay();
  if(tab==='pl'&&!ro)bindPl();
  document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{season=b.dataset.y;render()});
  if(tab==='table')document.querySelectorAll('th[data-k]').forEach(t=>t.onclick=()=>{const k=t.dataset.k;if(sortK===k)sortD*=-1;else{sortK=k;sortD=k==='name'?1:-1}render()});
  if(tab==='pro'||tab==='du'){const ps=document.getElementById('ps');if(ps)ps.onchange=()=>{selP=ps.value;render()}}
  if(tab==='hist')document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Spiel löschen?')){delMatch(b.dataset.d);render()}});
}
render();
</script>
